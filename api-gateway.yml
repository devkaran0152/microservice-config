
spring:
  application:
    name: api-gateway

  config:
    import: "configserver:http://localhost:9093"

  data:
    redis:
      url: ${REDIS_URL}
      connect-timeout: 3s
      timeout: 3s

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: api-1
              uri: lb://WELCOME-API
              predicates:
                - Path=/welcome
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1

            - id: api-2
              uri: lb://GREET-API
              predicates:
                - Path=/greet

server:
  port: 3333

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
