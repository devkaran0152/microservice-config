
server:
  port: 3333

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: api-1
              uri: lb://WELCOME-API
              predicates:
                - Path=/welcome

            - id: api-2
              uri: lb://GREET-API
              predicates:
                - Path=/greet

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
