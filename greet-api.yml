server:
  port: 9091

spring:
  application:
    name: greet-api
  config:
    import: "configserver:http://localhost:9093"
  boot:
    admin:
      client:
        url: http://localhost:1111/

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"
